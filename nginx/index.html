<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Exercise4 - NGINX</title>
    <script>
        function sendReq() {
            fetch('/service1');
        }

        function stopSystem() {
            fetch('/shutdown', {
                method: 'POST'
            });
        }
    </script>
</head>

<body>
    <h1>Exercise4 - NGINX</h1>
    <button onclick="sendReq()">REQUEST</button>
    <button onclick="stopSystem()">STOP</button>
    <br><br>
    <textarea id="response" rows="20" cols="80"></textarea>
</body>

</html>
