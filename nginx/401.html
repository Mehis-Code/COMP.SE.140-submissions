<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Unauthorized</title>
</head>

<body>
    <h1>401 Unauthorized</h1>
    <p>Wrong password or username</p>
    <p>Please try again :)</p>
    <a href="/" onclick="retryLogin()">Retry</a>
    <script>
        function retryLogin() {
            window.location.href = '/';
        }
    </script>
</body>

</html>
