image: docker

stages:
  - build
  - test
  - deploy

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  COMPOSE_PROJECT_NAME: devops

build:
  stage: build
  script:
    - docker-compose up --build
    - docker image ls
    - docker ps

test:
  stage: test
  script:
    - echo "Test phase initiated"
    - docker ps

deploy:
  stage: deploy
  script:
    - echo "Deploy phase mock"
