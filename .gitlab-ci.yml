image: docker

stages:
  - build
  - test
  - deploy

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

before_script:
  - apk add --no-cache python3 py3-pip
  - pip3 install requests pytest

build:
  stage: build
  script:
    - docker ps
    - docker-compose build
    - echo "Asd!"

test:
  stage: test
  script:
    - echo "Test phase initiated"
    - pytest tests.py

deploy:
  stage: deploy
  script:
    - echo "Deploy phase mock"
