image: docker

stages:
  - build
  - test
  - deploy

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build:
  stage: build
  script:
    - docker ps
    - docker-compose build
    - echo "Asd!"

test:
  stage: test
  script:
    - echo "Test phase initiated"
    - apk add --no-cache python3 py3-pip
    - python3 -m venv venv
    - . venv/bin/activate
    - pip install requests pytest
    - docker-compose build
    - pytest tests.py

deploy:
  stage: deploy
  script:
    - echo "Deploy phase mock"
