stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375

services:
  - name: docker:dind
    command: ["--privileged"]

before_script:
  - apk add --no-cache docker-compose

build:
  stage: build
  image: docker:latest
  script:
    - docker-compose build --no-cache
  tags:
    - test6

test:
  stage: test
  image: docker:latest
  script:
    - echo "Starting tests"
  tags:
    - test6

deploy:
  stage: deploy
  image: docker:latest
  script:
    - docker-compose up -d
  tags:
    - test6
