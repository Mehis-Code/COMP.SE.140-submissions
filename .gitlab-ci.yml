image: docker

stages:
  - build
  - test
  - deploy

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build:
  stage: build
  before:
    - mkdir -p "$TAR_FILE_FOLDER"
  script:
    - docker build -t $BUILD_DOCKER_IMAGE":"$BUILD_DOCKER_IMAGE_VERSION" .
    - docker save -o "$TAR_FILE_FOLDER""$TAR_FILE_PATH""$TAR_FILE_NAME" "$BUILD_DOCKER_IMAGE":"$BUILD_DOCKER_IMAGE_VERSION"
  artifacts:
    paths:
      - "$TAR_FILE_FOLDER"

test:
  stage: test
  script:
    - echo "Test phase initiated"
    - apk add --no-cache python3 py3-pip
    - python3 -m venv venv
    - . venv/bin/activate
    - pip install requests pytest
    - docker-compose build
    - pytest tests.py

deploy:
  stage: deploy
  script:
    - echo "Deploy phase mock"
