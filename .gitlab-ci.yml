image: docker

stages:
  - build
  - test
  - deploy

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

#Verifying that a build is succesful
build:
  stage: build
  script:
    - docker-compose build
    - docker image ls
    - docker ps

#Running tests on a built
test:
  stage: test
  script:
    - echo "Test phase initiated"
    - docker-compose up --build -d
    - docker ps

deploy:
  stage: deploy
  script:
    - echo "Deploy phase mock"
