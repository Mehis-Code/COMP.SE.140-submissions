stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2

services:
  - docker:20.10.16-dind

build:
  stage: build
  image: docker:20.10.16
  script:
    - apk add --no-cache docker-compose
    - docker-compose build --no-cache
  tags:
    - docker

test:
  stage: test
  image: docker:20.10.16
  script:
    - echo "Starting tests"
  tags:
    - docker

deploy:
  stage: deploy
  image: docker:20.10.16
  script:
    - apk add --no-cache docker-compose
    - docker-compose up -d
  tags:
    - docker
