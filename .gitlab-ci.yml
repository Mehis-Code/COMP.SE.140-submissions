image: docker

stages:
  - build
  - test
  - deploy

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build:
  stage: build
  script:
    - docker ps
    - docker-compose build
    - echo "Asd!"

test:
  image: python:latest
  stage: test
  script:
    - echo "Test phase initiated"
    - python tests.py

deploy:
  stage: deploy
  script:
    - echo "Deploy phase mock"
