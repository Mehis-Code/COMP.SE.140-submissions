image: docker

stages:
  - build
  - test
  - deploy

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build:
  stage: build
  before_script:
    - mkdir .docker
  script:
    - docker-compose build -t devops .
    - docker save -o .docker/devops.tar devops
  artifacts:
    paths:
      - .docker/

test:
  stage: test
  before_script:
    - docker load -q -i .docker/devops.tar
  script:
    - echo "Test phase initiated"
    - apk add --no-cache python3 py3-pip
    - python3 -m venv venv
    - . venv/bin/activate
    - pip install requests pytest
    - docker-compose build
    - pytest tests.py

deploy:
  stage: deploy
  script:
    - echo "Deploy phase mock"
