image: docker

stages:
  - build
  - test
  - deploy

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build:
  stage: build
  script:
    - docker ps
    - docker-compose build -t app
    - mkdir image
    - docker save app > image/app.tar
    - echo "Asd!"
  artifacts:
    paths:
      - image

test:
  stage: test
  script:
    - echo "Test phase initiated"
    - docker load -i image/app.tar
    - docker run --name app -d app
    - docker exec app python tests.py

deploy:
  stage: deploy
  script:
    - echo "Deploy phase mock"
