stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

services:
  - name: docker:20.10.16-dind
    command: ["--privileged"]

build:
  stage: build
  image: docker:20.10.16
  script:
    - apk add --no-cache docker-compose
    - docker-compose build --no-cache
  tags:
    - docker5

test:
  stage: test
  image: docker:20.10.16
  script:
    - echo "Starting tests"
  tags:
    - docker5

deploy:
  stage: deploy
  image: docker:20.10.16
  script:
    - apk add --no-cache docker-compose
    - docker-compose up -d
  tags:
    - docker5
