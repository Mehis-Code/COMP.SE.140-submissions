stages:
  - build
  - test
  - deploy
services:
  - docker:dind

build:
  stage: build
  image: alpine:latest
  script:
    - apk add --no-cache docker-compose
    - docker-compose up build --no-cache
  tags:
    - docker5

test:
  stage: test
  image: alpine:latest
  script:
    - echo "Starting tests"
  tags:
    - docker5

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache docker-compose
    - docker-compose up -d
  tags:
    - docker5
