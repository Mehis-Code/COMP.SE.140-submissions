image: docker

stages:
  - build
  - test
  - deploy

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

#Verifying that a build is successful
build:
  stage: build
  script:
    - echo "BUILD PHASE INITIATED"
    - docker-compose build
    - docker image ls
    - docker ps
    - echo "BUILD SUCCESSFUL"

#Running tests on a built project
#I could not get the build passed on as artifacts due to limited size.
#Learned that Gitlab admins could increase the size, but I don't have access to that.
#There might be a smarter way related to mounting volumes, but I couldn't do it.
#I decided to continue with knowing my limitations. The result is a slowed down operation,
#and the build stage might be redundant.
test:
  stage: test
  before_script:
    - echo "Dependencies for python testing"
    - apk add --no-cache python3 py3-pip curl

  script:
    - echo "TEST PHASE INITIATED"
    - docker-compose up --build -d
    - docker ps
    - echo "INITIATING TESTS IN PYTHON VENV"
    - python3 -m venv venv
    - . venv/bin/activate
    - pip install requests pytest
    - pytest -q --tb=short tests/tests_for_pipeline.py
    - docker ps
    - deactivate
    - echo "TESTS SUCCESSFUL"

deploy:
  stage: deploy
  before_script:
    - apt-get update -y && apt-get install -yqqf openssh-client git unzip sshpass rsync --fix-missing
    - "which ssh-agent || ( apt-get update -y && apt-get install openssh-client git -y )"
    - eval $(ssh-agent -s)
    - echo "$PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - ssh-keyscan $GITLAB_URL >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

    - git config --global user.email "lotte.karlsson@email.com"
    - git config --global user.name "Gitlab Runner"
  script:
    - echo "Deploying current file to main branch"
    - git checkout main
    - git push second main
  only:
    - project
