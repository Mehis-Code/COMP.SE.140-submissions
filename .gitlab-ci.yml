stages:
  - build
  - test
  - deploy

build:
  stage: build
  image: alpine:latest
  script:
    - apk add --no-cache docker-compose
    - docker-compose build --no-cache
  tags:
    - runner

test:
  stage: test
  image: alpine:latest
  script:
    - echo "Starting tests"
  tags:
    - runner

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache docker-compose
    - docker-compose up -d
  tags:
    - runner
